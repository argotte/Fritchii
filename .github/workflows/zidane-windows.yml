name: zidane-windows

# Windows builds of the zidane branch (Fritchii v6.2 for a Ryzen 7 7435HS / RTX 4060 Laptop / 16 GB
# laptop). clang-cl like the official releases, so NVIDIA DLSS is compiled in (the MinGW build of
# release-binaries.yml has no DLSS). Two variants from the same commit and toolchain, for A/B tests:
#   zen3     -march=znver3 -mtune=znver3, no FMA contraction (same float results as standard)
#   standard no CPU preset, the configuration of the official release
# The update checker is off: it points at another project's releases.

on:
  workflow_dispatch:
  push:
    branches:
      - zidane
    paths:
      - "src/**"
      - "!src/tests/**"
      - "CMakeLists.txt"
      - "CMakeModules/**"
      - "externals/**"
      - "dist/**"
      - ".patch/**"
      - "cpmfile.json"
      - ".github/workflows/zidane-windows.yml"

permissions:
  contents: read

# A personal fork: the newest push wins.
concurrency:
  group: zidane-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: windows ${{ matrix.label }}
    runs-on: windows-2022
    timeout-minutes: 340
    env:
      SCCACHE_DIR: ${{ github.workspace }}/.sccache
      SCCACHE_CACHE_SIZE: 3G
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: zen3
            preset: zen3
          - label: standard
            preset: custom

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: qtcharts
          cache: true

      - name: Install sccache
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP 'sccache.zip'
          Invoke-WebRequest -OutFile $zip https://github.com/mozilla/sccache/releases/download/v0.19.0/sccache-v0.19.0-x86_64-pc-windows-msvc.zip
          Expand-Archive $zip -DestinationPath (Join-Path $env:RUNNER_TEMP 'sccache')
          $bin = (Get-ChildItem -Recurse -Filter sccache.exe (Join-Path $env:RUNNER_TEMP 'sccache')).DirectoryName
          $bin | Out-File -Append -Encoding utf8 $env:GITHUB_PATH

      - name: Install Vulkan SDK
        shell: pwsh
        run: ./tools/windows/install-vulkan-sdk.ps1

      - name: Show tool versions
        shell: bash
        run: |
          glslangValidator --version | head -n 1
          clang-cl --version
          cmake --version | head -n 1

      - name: Restore CPM downloads
        id: cpm-cache
        uses: actions/cache/restore@v5
        with:
          path: .cache/cpm
          key: cpm-zidane-windows-v1-${{ hashFiles('cpmfile.json', 'CMakeLists.txt', 'CMakeModules/CPM*.cmake', 'externals/**/CMakeLists.txt', 'src/**/CMakeLists.txt') }}
          restore-keys: |
            cpm-zidane-windows-v1-

      - name: Restore compiler objects
        id: compiler-cache
        uses: actions/cache/restore@v5
        with:
          path: .sccache
          key: objects-zidane-${{ matrix.label }}-v1-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            objects-zidane-${{ matrix.label }}-v1-${{ github.sha }}-
            objects-zidane-${{ matrix.label }}-v1-

      # LICHII_BUILD_TAG stays empty, as in the official release: a build-N tag would make the program
      # call itself Lichii instead of Fritchii v6.2.
      - name: Configure
        shell: bash
        run: >-
          cmake -S . -B build/release -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER=clang-cl
          -DCMAKE_CXX_COMPILER=clang-cl
          -DYUZU_BUILD_PRESET=${{ matrix.preset }}
          -DBUILD_TESTING=OFF
          -DYUZU_TESTS=OFF
          -DYUZU_CMD=ON
          -DYUZU_ROOM=OFF
          -DYUZU_ROOM_STANDALONE=OFF
          -DYUZU_USE_BUNDLED_QT=OFF
          -DYUZU_USE_BUNDLED_SDL3=ON
          -DENABLE_UPDATE_CHECKER=OFF
          -DUSE_DISCORD_PRESENCE=OFF
          -DCMAKE_C_COMPILER_LAUNCHER=sccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=sccache
          2>&1 | tee configure.log

      - name: Save CPM downloads
        if: steps.cpm-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v5
        with:
          path: .cache/cpm
          key: ${{ steps.cpm-cache.outputs.cache-primary-key }}

      - name: Build
        shell: bash
        run: |
          sccache --zero-stats
          cmake --build build/release --target yuzu yuzu-cmd --parallel 2>&1 | tee build.log
          sccache --show-stats

      - name: Stop sccache
        if: always() && steps.compiler-cache.outcome == 'success'
        shell: pwsh
        run: sccache --stop-server

      - name: Save compiler objects
        if: always() && steps.compiler-cache.outcome == 'success'
        uses: actions/cache/save@v5
        with:
          path: .sccache
          key: ${{ steps.compiler-cache.outputs.cache-primary-key }}

      # fritchii_build.txt next to the exe adds its first line to the title bar and the log
      # (Common::BuildTag), so these builds can be told from the official one.
      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          for exe in fritchii.exe lichii.exe eden-cli.exe; do
            test -f "build/release/bin/$exe" || { echo "build/release/bin/$exe was not produced"; exit 1; }
          done
          windeployqt --release --no-translations build/release/bin/fritchii.exe
          printf 'zidane-%s %s\n' "${GITHUB_RUN_NUMBER}" "${{ matrix.label }}" > build/release/bin/fritchii_build.txt

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: fritchii-zidane-${{ matrix.label }}
          path: build/release/bin/
          if-no-files-found: error
          retention-days: 14

      # The proxy this fork is maintained through can read check-run annotations but not job logs,
      # so a failure puts the first errors and the end of the log into annotations.
      - name: Report failure
        if: failure()
        shell: bash
        run: |
          annotate() {
            local msg
            msg=$(cat)
            msg=${msg//'%'/'%25'}
            msg=${msg//$'\r'/}
            msg=${msg//$'\n'/'%0A'}
            echo "::error title=$1::${msg:0:12000}"
          }
          for log in configure.log build.log; do
            [ -f "$log" ] || continue
            grep -n -i -E "error|fatal|FAILED" "$log" | head -n 60 | annotate "$log: first errors"
            tail -n 80 "$log" | annotate "$log: last lines"
          done

  release:
    name: Publish pre-release
    needs: build
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download builds
        uses: actions/download-artifact@v7
        with:
          pattern: fritchii-zidane-*
          path: artifacts

      - name: Zip
        shell: bash
        run: |
          set -euo pipefail
          mkdir dist
          shopt -s nullglob
          for dir in artifacts/fritchii-zidane-*/; do
            label=${dir%/}
            label=${label##*-}
            (cd "$dir" && zip -qr "${GITHUB_WORKSPACE}/dist/Fritchii-v6.2-zidane-${GITHUB_RUN_NUMBER}-${label}-Windows-x64.zip" .)
          done
          ls -la dist
          compgen -G "dist/*.zip" > /dev/null || { echo "No build succeeded"; exit 1; }

      - name: Create release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="zidane-build-${GITHUB_RUN_NUMBER}"
          cat > notes.md <<EOF
          Build automático de la rama \`${GITHUB_REF_NAME}\` (${GITHUB_SHA::7}), basada en Fritchii v6.2.

          | Archivo | Qué es |
          | --- | --- |
          | \`...-zen3-Windows-x64.zip\` | Optimizado para Ryzen Zen 3 / Zen 3+ (tu 7435HS). **No arranca en CPUs más viejas.** |
          | \`...-standard-Windows-x64.zip\` | Misma configuración que la release oficial, para comparar. |

          Descomprime en una carpeta nueva y abre \`fritchii.exe\`. Usa los mismos datos, ajustes y caché de shaders que la v6.2 oficial.
          La barra de título dice \`v6.2 zidane-${GITHUB_RUN_NUMBER} zen3\` o \`... standard\`.
          El buscador de actualizaciones está apagado en estos builds.
          EOF
          gh release create "$tag" dist/*.zip \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --prerelease \
            --title "Fritchii v6.2 zidane build ${GITHUB_RUN_NUMBER} (${GITHUB_SHA::7})" \
            --notes-file notes.md
