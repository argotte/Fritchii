name: zidane-windows

# Windows builds of the zidane branch (Fritchii for a Ryzen 7 7435HS / RTX 4060 Laptop / 16 GB
# laptop). clang-cl like the official releases, so NVIDIA DLSS is compiled in (the MinGW build of
# release-binaries.yml has no DLSS). Two variants from the same commit and toolchain, for A/B tests:
#   zen3     -march=znver3 -mtune=znver3, no FMA contraction (same float results as standard)
#   standard no CPU preset, the configuration of the official release
# The update checker is off: it points at another project's releases.

on:
  workflow_dispatch:
  push:
    branches:
      - zidane
    paths:
      - "src/**"
      - "!src/tests/**"
      - "CMakeLists.txt"
      - "CMakeModules/**"
      - "externals/**"
      - "dist/**"
      - ".patch/**"
      - "cpmfile.json"
      - ".github/workflows/zidane-windows.yml"

permissions:
  contents: read

# A personal fork: the newest push wins.
concurrency:
  group: zidane-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: windows ${{ matrix.label }}
    runs-on: windows-2022
    timeout-minutes: 340
    env:
      SCCACHE_DIR: ${{ github.workspace }}/.sccache
      SCCACHE_CACHE_SIZE: 3G
      LLVM_VERSION: "22.1.8"
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: zen3
            preset: zen3
          - label: standard
            preset: custom

    steps:
      # The Preparing shaders stamp hashes the shader sources with their line endings. The official
      # Windows release comes from a CRLF checkout (stamp 143b6220486fb09b): the same stamp lets
      # players keep the shaders they already prepared.
      - name: Use CRLF line endings
        shell: bash
        run: git config --global core.autocrlf true

      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: qtcharts
          cache: true

      - name: Install sccache
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP 'sccache.zip'
          Invoke-WebRequest -OutFile $zip https://github.com/mozilla/sccache/releases/download/v0.19.0/sccache-v0.19.0-x86_64-pc-windows-msvc.zip
          Expand-Archive $zip -DestinationPath (Join-Path $env:RUNNER_TEMP 'sccache')
          $bin = (Get-ChildItem -Recurse -Filter sccache.exe (Join-Path $env:RUNNER_TEMP 'sccache')).DirectoryName
          $bin | Out-File -Append -Encoding utf8 $env:GITHUB_PATH

      - name: Install Vulkan SDK
        shell: pwsh
        run: ./tools/windows/install-vulkan-sdk.ps1

      # The official releases are built with clang-cl from LLVM 22 (AGENTS.md). Visual Studio's own
      # clang-cl on the runner is 19 and fails on v6.2's sources, so LLVM 22 goes in C:\llvm22 and
      # CMake gets its full path.
      - name: Install LLVM ${{ env.LLVM_VERSION }}
        shell: pwsh
        run: |
          $exe = Join-Path $env:RUNNER_TEMP "LLVM-$env:LLVM_VERSION-win64.exe"
          Invoke-WebRequest -OutFile $exe "https://github.com/llvm/llvm-project/releases/download/llvmorg-$env:LLVM_VERSION/LLVM-$env:LLVM_VERSION-win64.exe"
          Start-Process -Wait -FilePath $exe -ArgumentList '/S', '/D=C:\llvm22'
          if (-not (Test-Path 'C:\llvm22\bin\clang-cl.exe')) { throw 'LLVM did not install' }

      - name: Show tool versions
        shell: bash
        run: |
          glslangValidator --version | head -n 1
          /c/llvm22/bin/clang-cl.exe --version
          cmake --version | head -n 1
          echo "::notice title=tools::$(/c/llvm22/bin/clang-cl.exe --version | head -n 1); $(cmake --version | head -n 1)"

      - name: Restore CPM downloads
        id: cpm-cache
        uses: actions/cache/restore@v5
        with:
          path: .cache/cpm
          key: cpm-zidane-windows-v1-${{ hashFiles('cpmfile.json', 'CMakeLists.txt', 'CMakeModules/CPM*.cmake', 'externals/**/CMakeLists.txt', 'src/**/CMakeLists.txt') }}
          restore-keys: |
            cpm-zidane-windows-v1-

      - name: Restore compiler objects
        id: compiler-cache
        uses: actions/cache/restore@v5
        with:
          path: .sccache
          key: objects-zidane-${{ matrix.label }}-v1-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            objects-zidane-${{ matrix.label }}-v1-${{ github.sha }}-
            objects-zidane-${{ matrix.label }}-v1-

      # LICHII_BUILD_TAG stays empty, as in the official release: a build-N tag would make the program
      # call itself Lichii instead of Fritchii v6.2. ENABLE_WERROR=OFF: under clang-cl
      # src/CMakeLists.txt turns on -Werror=unused without its -Wno-error=unused (that is NOT MSVC
      # only), and v6.2 has unused lambda captures; warnings change no generated code.
      - name: Configure
        shell: bash
        run: >-
          cmake -S . -B build/release -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER=C:/llvm22/bin/clang-cl.exe
          -DCMAKE_CXX_COMPILER=C:/llvm22/bin/clang-cl.exe
          -DCMAKE_ASM_COMPILER=C:/llvm22/bin/clang-cl.exe
          -DYUZU_BUILD_PRESET=${{ matrix.preset }}
          -DBUILD_TESTING=OFF
          -DYUZU_TESTS=OFF
          -DYUZU_USE_BUNDLED_QT=OFF
          -DYUZU_USE_BUNDLED_SDL3=ON
          -DENABLE_UPDATE_CHECKER=OFF
          -DUSE_DISCORD_PRESENCE=OFF
          -DENABLE_WERROR=OFF
          -DCMAKE_C_COMPILER_LAUNCHER=sccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=sccache
          2>&1 | tee configure.log

      - name: Save CPM downloads
        if: steps.cpm-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v5
        with:
          path: .cache/cpm
          key: ${{ steps.cpm-cache.outputs.cache-primary-key }}

      # v6.2 has no command-line program: the yuzu target is fritchii.exe, and it builds the small
      # lichii.exe forwarder with it.
      - name: Build
        shell: bash
        run: |
          sccache --zero-stats
          cmake --build build/release --target yuzu --parallel 2>&1 | tee build.log
          sccache --show-stats

      - name: Check the Preparing shaders stamp
        shell: bash
        run: |
          stamp=$(grep -o '"[0-9a-f]*"' build/release/src/video_core/nx2_shader_stamp.h | tr -d '"')
          echo "::notice title=shader stamp::$stamp"
          if [ "$stamp" != "143b6220486fb09b" ]; then
            echo "::error title=shader stamp::$stamp is not the official Windows stamp 143b6220486fb09b (v6.1 to v6.5): players would prepare all shaders again"
            exit 1
          fi

      - name: Stop sccache
        if: always() && steps.compiler-cache.outcome == 'success'
        shell: pwsh
        run: sccache --stop-server

      - name: Save compiler objects
        if: always() && steps.compiler-cache.outcome == 'success'
        uses: actions/cache/save@v5
        with:
          path: .sccache
          key: ${{ steps.compiler-cache.outputs.cache-primary-key }}

      # fritchii_build.txt next to the exe adds its first line to the title bar and the log
      # (Common::BuildTag), so these builds can be told from the official one.
      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          for exe in fritchii.exe lichii.exe; do
            test -f "build/release/bin/$exe" || { echo "build/release/bin/$exe was not produced"; exit 1; }
          done
          windeployqt --release --no-translations build/release/bin/fritchii.exe
          printf 'zidane-%s %s\n' "${GITHUB_RUN_NUMBER}" "${{ matrix.label }}" > build/release/bin/fritchii_build.txt

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: fritchii-zidane-${{ matrix.label }}
          path: build/release/bin/
          if-no-files-found: error
          retention-days: 14

      # The proxy this fork is maintained through can read check-run annotations but not job logs,
      # so a failure puts the first errors and the end of the log into annotations.
      - name: Report failure
        if: failure()
        shell: bash
        run: |
          # A grep that matches nothing must not end this step before it reports.
          set +e +o pipefail
          annotate() {
            local msg
            msg=$(cat)
            msg=${msg//'%'/'%25'}
            msg=${msg//$'\r'/}
            msg=${msg//$'\n'/'%0A'}
            echo "::error title=$1::${msg:0:12000}"
          }
          # Compiler diagnostics without the (very long) command lines, each cut to 600 characters.
          for log in configure.log build.log; do
            [ -f "$log" ] || continue
            grep -n -E "error:|error [A-Z]+[0-9]+:|fatal error|CMake Error|FAILED:" "$log" |
              grep -v -E "^[0-9]+:sccache " | cut -c1-600 | head -n 40 | annotate "$log: first errors"
            grep -A 10 "CMake Error" "$log" | head -n 40 | cut -c1-600 | annotate "$log: CMake errors"
            grep -v -E "^sccache |^\[[0-9]+/[0-9]+\] |unknown argument ignored" "$log" |
              tail -n 60 | cut -c1-600 | annotate "$log: last lines"
          done
          [ -f configure.log ] || echo "::error title=no logs::The job failed before Configure"
          df -h . | annotate "disk"
          exit 0

  release:
    name: Publish pre-release
    needs: build
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      # The version label ("v6.5") names the files and the release.
      - name: Check out the version label
        uses: actions/checkout@v5
        with:
          sparse-checkout: dist/frizti_version_label.txt
          sparse-checkout-cone-mode: false

      - name: Download builds
        uses: actions/download-artifact@v7
        with:
          pattern: fritchii-zidane-*
          path: artifacts

      - name: Zip
        shell: bash
        run: |
          set -euo pipefail
          version=$(head -n 1 dist/frizti_version_label.txt | tr -d '\r\n ')
          echo "VERSION=$version" >> "$GITHUB_ENV"
          mkdir -p out
          shopt -s nullglob
          for dir in artifacts/fritchii-zidane-*/; do
            label=${dir%/}
            label=${label##*-}
            (cd "$dir" && zip -qr "${GITHUB_WORKSPACE}/out/Fritchii-${version}-zidane-${GITHUB_RUN_NUMBER}-${label}-Windows-x64.zip" .)
          done
          ls -la out
          compgen -G "out/*.zip" > /dev/null || { echo "No build succeeded"; exit 1; }

      - name: Create release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="zidane-build-${GITHUB_RUN_NUMBER}"
          cat > notes.md <<EOF
          Build automático de la rama \`${GITHUB_REF_NAME}\` (${GITHUB_SHA::7}), basada en Fritchii ${VERSION}.

          | Archivo | Qué es |
          | --- | --- |
          | \`...-zen3-Windows-x64.zip\` | Optimizado para Ryzen Zen 3 / Zen 3+ (tu 7435HS). **No arranca en CPUs más viejas.** |
          | \`...-standard-Windows-x64.zip\` | Misma configuración que la release oficial, para comparar. |

          Descomprime en una carpeta nueva y abre \`fritchii.exe\`. Usa los mismos datos, ajustes y caché de shaders que la ${VERSION} oficial.
          La barra de título dice \`${VERSION} zidane-${GITHUB_RUN_NUMBER} zen3\` o \`... standard\`.
          El buscador de actualizaciones está apagado en estos builds.
          EOF
          gh release create "$tag" out/*.zip \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --prerelease \
            --title "Fritchii ${VERSION} zidane build ${GITHUB_RUN_NUMBER} (${GITHUB_SHA::7})" \
            --notes-file notes.md
